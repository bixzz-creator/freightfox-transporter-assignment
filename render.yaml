# Render Infrastructure Blueprint for FreightFox Transporter Assignment Service
# Compatible with Render Web Service (Docker) & Neon Serverless PostgreSQL

services:
  - type: web
    name: freightfox-transporter-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
