# Render Infrastructure Blueprint for FreightFox Platform
services:
  - type: web
    name: freightfox-transporter-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: freightfox-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: freightfox-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: freightfox-db
          property: password

databases:
  - name: freightfox-db
    plan: free
    region: oregon
    databaseName: transporter_db
    user: postgres
